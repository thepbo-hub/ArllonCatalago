<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada — Arllon Fernandes Barbearia</title>
    <meta name="robots" content="noindex" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #04172B;
        color: #F5F8FC;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: linear-gradient(180deg, #0B2340 0%, #04172B 100%);
        border: 1px solid rgba(22, 135, 255, 0.4);
        border-radius: 20px;
        padding: 40px 24px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 50px rgba(4, 23, 43, 0.9);
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 9999px;
        background: rgba(8, 46, 90, 0.7);
        border: 1px solid rgba(66, 200, 255, 0.4);
        color: #42C8FF;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 28px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
        color: #F5F8FC;
      }
      p {
        font-size: 14px;
        color: #AAB8CA;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      a.btn {
        display: inline-block;
        background: linear-gradient(180deg, #1C8DFF 0%, #1170DE 100%);
        color: #FFFFFF;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border: 1px solid rgba(66, 200, 255, 0.6);
        box-shadow: 0 4px 15px rgba(22, 135, 255, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      a.btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(66, 200, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Erro 404</div>
      <h1>Página Não Encontrada</h1>
      <p>O link acessado não existe ou foi alterado. O catálogo oficial da Arllon Fernandes Barbearia continua disponível abaixo.</p>
      <a href="/" class="btn">Voltar ao Catálogo Oficial</a>
    </div>
  </body>
</html>
